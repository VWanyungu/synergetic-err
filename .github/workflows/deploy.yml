name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'vwanyungu' }}/synergetic-err-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'vwanyungu' }}/synergetic-err-frontend

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS & Run Migrations
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          envs: BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -e
            echo "==> Deploying Synergetic Enterprise Risk Register..."

            # Navigate to application directory
            APP_DIR="${{ secrets.VPS_APP_DIR || '/var/www/synergetic-err' }}"
            if [ ! -d "$APP_DIR" ]; then
              echo "Error: Directory $APP_DIR does not exist on VPS."
              exit 1
            fi
            cd "$APP_DIR"

            # Pull latest git changes if repo is cloned
            if [ -d .git ]; then
              echo "==> Fetching latest repo changes..."
              git fetch origin main
              git reset --hard origin/main
            fi

            # Log in to Docker Hub to pull images
            echo "==> Logging in to Docker Hub..."
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Pull latest application images
            echo "==> Pulling updated docker images..."
            docker compose pull

            # Stop and remove existing containers
            echo "==> Stopping running containers..."
            docker compose down

            # Start up containers in detached mode
            echo "==> Starting containers..."
            docker compose up -d

            # Wait for backend container to become ready
            echo "==> Waiting for backend and database to become ready..."
            ATTEMPTS=0
            MAX_ATTEMPTS=30
            until docker compose exec -T backend bun run -e "process.exit(0)" > /dev/null 2>&1; do
              ATTEMPTS=$((ATTEMPTS+1))
              if [ $ATTEMPTS -ge $MAX_ATTEMPTS ]; then
                echo "Timeout waiting for backend service container."
                docker compose logs backend
                exit 1
              fi
              echo "Waiting for backend service container ($ATTEMPTS/$MAX_ATTEMPTS)..."
              sleep 2
            done

            # Run database migrations
            echo "==> Running Knex database migrations..."
            docker compose exec -T backend bun run migrate

            # Clean up old unused images to save disk space
            echo "==> Pruning dangling docker images..."
            docker image prune -f

            echo "==> Deployment and database migrations completed successfully!"

